name: onyx_mobile
description: Native Android and iOS BLE-MIDI editor for Pocket AMP running Onyx firmware.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.1.0
  cupertino_ui: 1.1.7
  flutter_reactive_ble: 5.6.0
  file_picker: 13.4.0
  share_plus: 13.3.1
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  crypto: 3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/editor_tables.json
    - assets/LICENSE.txt
  config:
    enable-swift-package-manager: true
